global:
  scrape_interval: 15s

scrape_configs:
  - job_name: crawler
    static_configs:
      - targets: ["crawler:9100"]

  # One target per tor replica (compose DNS returns every replica's address).
  - job_name: tor
    dns_sd_configs:
      - names: ["tor"]
        type: A
        port: 9035
        refresh_interval: 60s

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
